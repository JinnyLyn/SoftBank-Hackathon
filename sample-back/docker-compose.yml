services:
  app:
    build:
      context: ..
      dockerfile: sample-back/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://launchpad:launchpad_local_password@db:3306/launchpad
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: launchpad
      MYSQL_USER: launchpad
      MYSQL_PASSWORD: launchpad_local_password
      MYSQL_ROOT_PASSWORD: change_this_local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange_this_local_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
