name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR의 오래된 실행만 취소한다. main에 합쳐진 각 커밋은 끝까지 검사한다.
concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    name: CI coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sample_front: ${{ steps.components.outputs.sample_front }}
      sample_back: ${{ steps.components.outputs.sample_back }}
      front: ${{ steps.components.outputs.front }}
      back: ${{ steps.components.outputs.back }}
      infra: ${{ steps.components.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: CI 판정 회귀 검사
        run: python3 -m unittest discover -s scripts/ci -p 'test_components.py' -v
      - name: 실제 코드와 검사 계약 확인
        id: components
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/components.py inspect

  sample_front:
    name: Sample frontend (MOCK browser)
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript 문법과 브라우저 버전
        run: |
          node --version
          google-chrome --version
          node --check sample-front/app.js
          node --check sample-front/mock-api.js
          node --check scripts/ci/browser.mjs
          node --check scripts/ci/test_sample_front.mjs
      - name: 실제 Chrome으로 가입·글쓰기·응원·로그인 검사 (MOCK)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory sample-front > "$RUNNER_TEMP/sample-front-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html > /dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          test "$ready" = true
          node scripts/ci/test_sample_front.mjs --url http://127.0.0.1:8080/ --mode mock
          # API가 없는 화면을 실제 통합 성공으로 오인하면 CI 자체가 실패한다.
          if node scripts/ci/test_sample_front.mjs --url http://127.0.0.1:8080/ --mode real; then
            echo '::error::실제 API가 없는 서버가 real 검사에 통과했습니다.'
            exit 1
          fi

  sample_back:
    name: Sample app (real MySQL and browser)
    needs: inventory
    if: needs.inventory.outputs.sample_back == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 샘플 앱 빌드·실제 DB/API/화면·DB 중단·정리
        run: |
          docker compose version
          google-chrome --version
          bash scripts/ci/run_sample_stack.sh

  front:
    name: Platform frontend (typecheck and build)
    needs: inventory
    if: needs.inventory.outputs.front == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci --prefix front
      - name: MOCK 설정 타입 검사·빌드
        env:
          VITE_USE_MOCK: 'true'
        run: npm run build --prefix front
      - name: 실제 API 설정 타입 검사·빌드 (API 실행 증거 아님)
        env:
          VITE_USE_MOCK: 'false'
        run: npm run build --prefix front

  back:
    name: Platform backend (startup and API smoke)
    needs: inventory
    if: needs.inventory.outputs.back == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: back/.python-version
      - name: 백엔드 의존성 설치·호환성·문법
        run: |
          python -m pip install -r back/requirements.txt
          python -m pip check
          python -m compileall -q back/app
      - name: DB·AWS·LLM 없이 앱 기동·HTTP 계약 확인
        run: python scripts/ci/test_platform_back.py
  infra:
    name: Infrastructure (static validation)
    needs: inventory
    if: needs.inventory.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: AWS 자격 증명 없이 구문·설정 검사
        run: |
          terraform -chdir=infra fmt -check -recursive
          for root in infra/bootstrap infra/foundation infra/deployments/_template; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done
          bash -n infra/scripts/deploy.sh

  app_ci:
    name: Available app checks
    if: ${{ always() }}
    needs: [inventory, sample_front, sample_back, front, back, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 실패·취소·예상 밖 건너뜀 판정과 범위 요약
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/components.py report
