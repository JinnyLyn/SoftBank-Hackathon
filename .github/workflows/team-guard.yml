name: Team Git Guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR 본문을 연달아 수정하면 최신 보고만 판정한다.
concurrency:
  group: team-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  git-guard:
    name: Git guard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 검증용 Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 실제 Git 명령으로 훅 검증
        env:
          PYTHONUTF8: '1'
        run: python scripts/test_git_hooks.py
      - name: PR 보고 검사 회귀 검증
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s scripts/ci -p 'test_pr_report.py' -v
      - name: PR 컨텍스트·워크플로 보고 확인
        if: github.event_name == 'pull_request'
        env:
          PYTHONUTF8: '1'
        run: python scripts/ci/check_pr_report.py
